name: Android APK for installation testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build installable arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      DSH_MAVEN_MIRRORS: '0'
      DSH_MAVEN_CENTRAL_MIRROR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: android-shell-policy
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Configure Gradle Maven mirror
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/dsh-maven-mirror.gradle" <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
                  }
              }
              repositories {
                  maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
              }
              settings.dependencyResolutionManagement.repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.PREFER_PROJECT
              )
          }
          EOF
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install Flutter dependencies
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - name: Prepare complete Android runtime and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          runtime/build-runtime.sh arm64-v8a
      - name: Build installable APK
        run: tooling/build-apk.sh --debug -f arm64
      - name: Create APK checksum
        run: sha256sum app/build/app/outputs/flutter-apk/app-arm64-debug.apk > app/build/app/outputs/flutter-apk/SHA256SUMS
      - name: Upload APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-android-shell-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-debug.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
